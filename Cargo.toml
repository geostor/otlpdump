[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
otlp-core = { path = "crates/otlp-core" }
clap = { version = "4", features = ["derive"] }
humantime = "2"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14.4"
regex = "1"
serde = "1.0.229"
serde_json = "1.0.154"
tiny_http = "0.12.0"
